    <title>Protomates Lab</title>
    <script type="text/javascript">
      // Single Page Apps redirect for GitHub Pages and static web servers
      var l = window.location;
      var path = l.pathname.replace(/^\/|\/$/g, '');
      sessionStorage.redirect = l.href;
      l.replace(l.protocol + '//' + l.host + '/#' + path);
    </script>
